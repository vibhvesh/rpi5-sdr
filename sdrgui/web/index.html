<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RPi5 SDR Web</title><style>
body{font-family:sans-serif;background:#111;color:#ddd;margin:0;padding:10px}h2{margin:4px 0}
.card{background:#1c1c1c;border-radius:8px;padding:10px;margin-bottom:10px}
#info td{padding:2px 10px 2px 0}#msg{font-weight:bold;color:#ffb74d}canvas{width:100%;display:block;background:#000}
input,select,button{background:#333;color:#eee;border:1px solid #555;padding:5px;border-radius:4px;margin:2px}
pre{white-space:pre-wrap;font-size:12px;max-height:400px;overflow:auto}.row{display:flex;flex-wrap:wrap;gap:10px}
</style></head><body>
<h2>RPi5 RTL-SDR — Web Dashboard</h2>
<div class="row"><div class="card" style="flex:1;min-width:280px"><div id="msg">Connecting...</div><table id="info"></table></div>
<div class="card" style="flex:2;min-width:300px">
Freq <input id="freq" type="number" step="0.001" style="width:110px"> MHz <button onclick="tune()">Tune</button>
<select id="preset" onchange="preset()"><option>Presets...</option></select><br>
Gain <select id="gain" onchange="send({gain:this.value})"></select>
Sample rate <select id="rate" onchange="send({sample_rate:this.value})"></select>
PPM <input id="ppm" type="number" style="width:60px" onchange="send({ppm:this.value})"></div></div>
<div class="card"><canvas id="spec" width="1024" height="220"></canvas><canvas id="wf" width="1024" height="300"></canvas>
<div id="axis" style="display:flex;justify-content:space-between;font-size:12px"></div></div>
<div class="card"><button onclick="doctor()">Run Doctor report</button><pre id="doc"></pre></div>
<script>
let ws, inited=false; const $=id=>document.getElementById(id);
const sp=$('spec'), sc=sp.getContext('2d'), wf=$('wf'), wc=wf.getContext('2d');
function send(o){ if(ws&&ws.readyState==1) ws.send(JSON.stringify(o)); else fetch('/api/set',{method:'POST',body:JSON.stringify(o)}); }
function tune(){ send({center_freq:parseFloat($('freq').value)*1e6}); }
function preset(){ const v=$('preset').value; if(v!=='Presets...'){ $('freq').value=(parseFloat(v)/1e6).toFixed(3); tune(); } }
function doctor(){ $('doc').textContent='Running...'; fetch('/api/doctor').then(r=>r.text()).then(t=>$('doc').textContent=t); }
function showInfo(i){
  $('msg').textContent=i.message;
  const rows=[['Device',i.detected?'DETECTED':'NOT DETECTED'],['Name',i.name],['Tuner',i.tuner],['Serial',i.serial],
   ['Center freq',(i.center_freq/1e6).toFixed(4)+' MHz'],['Sample rate',(i.sample_rate/1e6).toFixed(3)+' MSPS'],['Gain',i.gain],
   ['PPM',i.ppm],['Bias-tee',i.bias_tee?'ON':'OFF'],['Pi temp',i.temp!=null?i.temp.toFixed(1)+' °C':'n/a'],
   ['CPU load',i.cpu!=null?i.cpu.toFixed(0)+' %':'n/a'],['Web URL',i.url]];
  $('info').innerHTML=rows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join('');
  if(!inited){ inited=true; $('freq').value=(i.center_freq/1e6).toFixed(3);
    for(const [k,v] of Object.entries(i.presets)) $('preset').add(new Option(k,v));
    $('gain').add(new Option('auto','auto')); i.gains.forEach(g=>$('gain').add(new Option(g,g)));
    i.rates.forEach(r=>$('rate').add(new Option((r/1e6).toFixed(3),r)));
    $('gain').value=String(i.gain); $('rate').value=String(i.sample_rate); $('ppm').value=i.ppm; }
}
function color(v){ v=Math.max(0,Math.min(1,v)); return [Math.floor(255*Math.min(1,v*2)),Math.floor(255*Math.max(0,v*2-1)),Math.floor(255*(1-v)*0.6)]; }
function frame(buf){
  const h=new Float64Array(buf,0,2), p=new Float32Array(buf,16), n=p.length;
  let lo=Infinity,hi=-Infinity; for(const v of p){lo=Math.min(lo,v);hi=Math.max(hi,v);} const r=(hi-lo)||1;
  if(sp.width!==n){sp.width=wf.width=n;}
  sc.fillStyle='#000';sc.fillRect(0,0,n,sp.height);sc.strokeStyle='#ff0';sc.beginPath();
  for(let x=0;x<n;x++){const y=sp.height-(p[x]-lo)/r*(sp.height-10)-5; x?sc.lineTo(x,y):sc.moveTo(x,y);} sc.stroke();
  wc.drawImage(wf,0,1); const row=wc.createImageData(n,1);
  for(let x=0;x<n;x++){const c=color((p[x]-lo)/r);row.data.set([c[0],c[1],c[2],255],x*4);} wc.putImageData(row,0,0);
  const c=h[0]/1e6,s=h[1]/1e6; $('axis').innerHTML=[c-s/2,c-s/4,c,c+s/4,c+s/2].map(f=>`<span>${f.toFixed(3)}</span>`).join('');
}
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws'); ws.binaryType='arraybuffer';
  ws.onmessage=e=>{ typeof e.data==='string'?showInfo(JSON.parse(e.data)):frame(e.data); };
  ws.onclose=()=>{ $('msg').textContent='Disconnected - retrying...'; setTimeout(connect,2000); };
}
connect();
</script></body></html>
